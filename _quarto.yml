project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "slides/*.qmd"
    - "!CLAUDE.md"

website:
  title: "Applied Data Science & Visualization"
  site-url: https://andrewvanleuven.github.io/uvm_datasci
  repo-url: https://github.com/andrewvanleuven/uvm_datasci
  favicon: img/favicon.png
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Schedule"
        href: schedule.qmd
      - text: "Syllabus"
        href: syllabus.qmd
      - text: "Project"
        href: project.qmd
    right:
      - icon: github
        href: https://github.com/andrewvanleuven/uvm_datasci
        aria-label: GitHub

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 2
    link-external-newwindow: true
    smooth-scroll: true
