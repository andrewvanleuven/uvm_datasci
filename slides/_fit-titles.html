<script>
// Shrink slide titles that wrap onto a second line (see .title-long in slides.scss).
(function () {
  function fitTitles(slide) {
    if (!slide) return;
    slide.querySelectorAll("h2").forEach(function (h) {
      h.classList.remove("title-long");
      var style = getComputedStyle(h);
      var lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.2;
      if (h.scrollHeight > lineHeight * 1.5) h.classList.add("title-long");
    });
  }
  function run() {
    Reveal.on("slidechanged", function (e) { fitTitles(e.currentSlide); });
    if (Reveal.isReady()) fitTitles(Reveal.getCurrentSlide());
    else Reveal.on("ready", function (e) { fitTitles(e.currentSlide); });
  }
  if (window.Reveal) run();
  else window.addEventListener("load", run);
})();
</script>
